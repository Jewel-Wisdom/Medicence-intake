<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Intake Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>🌸 Medicine Intake Tracker</h1>
        <p class="subtitle">Stay healthy, stay on track!</p>

        <div class="form-box">
            <h2>Add New Medicine</h2>

            <input type="text" id="medName" placeholder="Medicine Name (e.g. Paracetamol)">

            <input type="text" id="dosage" placeholder="Dosage (e.g. 500mg)">

            <input type="text" id="time" placeholder="Time to take (e.g. 8:00 AM)">

            <button onclick="addMedicine()">
                + Add Medicine
            </button>
        </div>

        <div class="sync-box">
            <button onclick="syncWithFirebase()">
                ☁️ Sync with Firebase
            </button>

            <p id="status">Status: Ready</p>
        </div>

        <div class="list-box">
            <h2>My Medicines 💊</h2>
            <ul id="medicineList"></ul>
        </div>
    </main>

    <script type="module" src="app.js"></script>

</body>

</html>
